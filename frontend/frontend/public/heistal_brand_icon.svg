<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d26"/>
      <stop offset="100%" stop-color="#002411"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea75"/>
      <stop offset="50%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#d99b00"/>
    </linearGradient>
  </defs>
  <!-- Background Badge with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#ffd000" stroke-width="2.5"/>
  <!-- Decorative Corner Accents -->
  <circle cx="10" cy="10" r="1.5" fill="#ffd000" opacity="0.6"/>
  <circle cx="54" cy="10" r="1.5" fill="#ffd000" opacity="0.6"/>
  <circle cx="10" cy="54" r="1.5" fill="#ffd000" opacity="0.6"/>
  <circle cx="54" cy="54" r="1.5" fill="#ffd000" opacity="0.6"/>
  <!-- Central Snowflake / Frost Icon -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="32" y1="12" x2="32" y2="52"/>
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="18" y1="18" x2="46" y2="46"/>
    <line x1="18" y1="46" x2="46" y2="18"/>
  </g>
  <!-- Stylized Letter 'H' for Heistal -->
  <path d="M22 17 L22 47 M42 17 L42 47 M22 32 L42 32" 
        stroke="url(#goldGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>
  <!-- Star Accent -->
  <path d="M32 28 L33.2 31.2 L36.5 32 L33.2 32.8 L32 36 L30.8 32.8 L27.5 32 L30.8 31.2 Z" 
        fill="#ffffff" 
        opacity="0.95"/>
</svg>