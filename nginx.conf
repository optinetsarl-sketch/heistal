user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 5000;
        listen 80;
        server_name heistal.ginolux.com localhost _;

        root /var/www/frontend;
        index index.html;

        # Frontend SPA React Router fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Brand Favicons (Force no-cache so browsers always refresh)
        location ~* ^/(favicon\.svg|favicon\.ico|heistal_brand_icon\.svg)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri /favicon.svg /heistal_brand_icon.svg =404;
        }

        # Cache static assets from Vite build
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Django API endpoints
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Django Admin
        location /admin/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Staticfiles (Admin, DRF browsable API)
        location /static/ {
            alias /app/backends/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Django Media files (images, uploads)
        location /media/ {
            alias /app/backends/media/;
            expires 30d;
            add_header Cache-Control "public";
        }
    }
}
